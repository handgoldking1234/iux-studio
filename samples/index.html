<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>샘플 미리보기 · IUX.STUDIO</title>
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 샘플 사이트 미리보기: samples/?s=폴더이름 → samples/폴더이름/index.html 을 PC · 모바일로 보여줍니다. */
  :root{--bar:#2f323a;--bar2:#1c1e23;--stage:#24262c;--t1:#fff;--t2:#a3a7b1;--blue:#3369ff;--ease:cubic-bezier(.16,1,.3,1)}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{display:flex;flex-direction:column;background:var(--stage);color:var(--t1);font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden}
  .bar{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;height:52px;padding:0 16px;background:var(--bar);box-shadow:0 1px 0 rgba(255,255,255,.06)}
  .bar__l{display:flex;align-items:center;gap:12px;min-width:0}
  .bar__back{display:grid;place-items:center;width:36px;height:36px;border-radius:8px;color:var(--t2);transition:background .15s,color .15s}
  .bar__back:hover{background:var(--bar2);color:var(--t1)}
  .bar__name{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .seg{display:flex;gap:4px}
  .seg button{display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:8px;background:none;color:var(--t2);cursor:pointer;transition:background .15s,color .15s}
  .seg button:hover{color:var(--t1)}
  .seg button[aria-pressed="true"]{background:var(--bar2);color:var(--t1)}
  .bar__r{justify-self:end}
  .bar__open{display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:8px;color:var(--t2);font-size:13px;font-weight:600;text-decoration:none;transition:background .15s,color .15s}
  .bar__open:hover{background:var(--bar2);color:var(--t1)}
  svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .bar__open svg{width:16px;height:16px}
  .stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;padding:0}
  .stage iframe{display:block;width:100%;height:100%;border:0;background:#fff;border-radius:0;box-shadow:none;
    transition:width .5s var(--ease),height .5s var(--ease),border-radius .5s var(--ease),box-shadow .5s}
  body.is-m .stage{padding:24px 16px}
  body.is-m .stage iframe{width:390px;max-width:100%;height:min(844px,100%);border-radius:28px;box-shadow:0 0 0 10px #0d0e11,0 24px 60px rgba(0,0,0,.5)}
  .msg{color:var(--t2);font-size:15px;text-align:center;line-height:1.7}
  .msg a{color:var(--blue)}
  @media (max-width:600px){
    .bar{padding:0 8px}
    .bar__open span{display:none}
    body.is-m .stage{padding:0}
    body.is-m .stage iframe{height:100%;border-radius:0;box-shadow:none}
  }
  @media (prefers-reduced-motion:reduce){.stage iframe{transition:none}}
</style>
</head>
<body>
<header class="bar">
  <div class="bar__l">
    <a class="bar__back" href="../#works" title="포트폴리오로 돌아가기" aria-label="포트폴리오로 돌아가기"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></a>
    <b class="bar__name" id="name">샘플 미리보기</b>
  </div>
  <div class="seg" role="group" aria-label="화면 크기">
    <button type="button" data-v="pc" aria-pressed="true" title="PC 화면"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg></button>
    <button type="button" data-v="m" aria-pressed="false" title="모바일 화면"><svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/></svg></button>
  </div>
  <div class="bar__r"><a class="bar__open" id="open" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M15 3h6v6M10 14L21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg><span>새 창으로 보기</span></a></div>
</header>
<main class="stage" id="stage"></main>
<script src="../js/content.js?v=10"></script>
<script>
(() => {
  'use strict';
  const q = new URLSearchParams(location.search);
  const slug = (q.get('s') || '').toLowerCase();
  const stage = document.getElementById('stage'), open = document.getElementById('open');
  if (!/^[a-z0-9-]+$/.test(slug)) {
    stage.innerHTML = '<p class="msg">샘플을 찾을 수 없습니다.<br><a href="../#works">포트폴리오로 돌아가기</a></p>';
    open.hidden = true; return;
  }
  const src = slug + '/';
  open.href = src;
  const frame = document.createElement('iframe');
  frame.src = src; frame.title = '샘플 사이트';
  // 이름은 포트폴리오 목록(js/content.js)에서, 없으면 샘플 페이지 제목에서
  const setName = t => { if (!t || t === 'Bundled Page') return; document.getElementById('name').textContent = t; document.title = t + ' · 샘플 미리보기'; };
  const work = (window.SITE?.works || []).find(w => (w.link || '').endsWith('?s=' + slug));
  if (work) setName(work.name);
  else frame.addEventListener('load', () => { try { setName(frame.contentDocument.title); } catch (e) {} });
  stage.appendChild(frame);

  /* 샘플은 HTML 한 장이라 서브페이지(*.html 등)가 없습니다.
     같은 페이지 안 이동(#id) · 전화 · 메일만 두고 나머지 링크와 폼 전송은 막습니다. */
  const guard = () => {
    let d; try { d = frame.contentDocument; } catch (e) { return; }
    if (!d || d.__iuxGuard) return;
    d.__iuxGuard = true;
    d.addEventListener('click', e => {
      const a = e.target.closest && e.target.closest('a[href]');
      if (!a) return;
      const h = (a.getAttribute('href') || '').trim();
      if (/^(tel|mailto):/i.test(h) || (h.startsWith('#') && h.length > 1)) return;
      e.preventDefault();
      // '#' 은 슬라이드 버튼 등 샘플 자체 동작이 있을 수 있어 이동만 막고, 다른 페이지 링크는 클릭 자체를 막습니다.
      if (h && h !== '#') e.stopImmediatePropagation();
    }, true);
    d.addEventListener('submit', e => e.preventDefault(), true);
    const w = frame.contentWindow;
    const css = w.document.createElement('style');
    css.textContent = 'a[href]:not([href^="#"]):not([href^="tel:"]):not([href^="mailto:"]),a[href="#"]{cursor:default!important}';
    (w.document.head || w.document.documentElement).appendChild(css);
  };
  // 번들 샘플은 로드 후 문서를 다시 그리므로, 로드 시점과 이후 몇 번 더 확인합니다.
  frame.addEventListener('load', () => { guard(); [500, 1500, 4000].forEach(t => setTimeout(guard, t)); });

  const btns = [...document.querySelectorAll('.seg button')];
  const setView = v => {
    document.body.classList.toggle('is-m', v === 'm');
    btns.forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v));
    q.set('v', v); history.replaceState(null, '', '?' + q);
  };
  btns.forEach(b => b.addEventListener('click', () => setView(b.dataset.v)));
  setView(q.get('v') === 'm' ? 'm' : 'pc');
})();
</script>
</body>
</html>
