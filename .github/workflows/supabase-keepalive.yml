# Supabase 무료 플랜은 7일간 요청이 없으면 프로젝트가 일시정지됩니다.
# 3일마다 공개 RPC(site_public)를 한 번 호출해 깨워 둡니다. (방문 통계에는 남지 않음)
# 호출이 실패하면 이 작업이 실패로 끝나고, GitHub 가 실패 알림 메일을 보냅니다.
# Actions 탭 > Supabase keepalive > Run workflow 로 바로 실행해 볼 수도 있습니다.
name: Supabase keepalive

on:
  schedule:
    - cron: '17 0 */3 * *' # 3일마다 09:17 (KST)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # js/content.js · admin/config.js 와 같은 공개(anon) 키입니다.
      SUPABASE_URL: https://flrdiplgoeyuvffwxvhq.supabase.co
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZscmRpcGxnb2V5dXZmZnd4dmhxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3NTgzNTgsImV4cCI6MjEwODMzNDM1OH0.yNLMwIgvr-f-TwU3fAHuSEC5QjvPp9K3I2T1jkC5UQk
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -sS -o body.json -w '%{http_code}' --retry 3 --retry-delay 20 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/site_public" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H 'Content-Type: application/json' -d '{"s":"iux-studio"}')
          echo "HTTP $code"; head -c 200 body.json; echo
          if [ "$code" != "200" ]; then
            echo "::error::Supabase 응답 $code — 프로젝트가 일시정지됐을 수 있습니다. supabase.com 대시보드에서 Restore 하세요."
            exit 1
          fi
