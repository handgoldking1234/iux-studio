<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공지사항 — IUX.STUDIO</title>
<meta name="description" content="IUX.STUDIO 공지사항과 소식">
<meta name="theme-color" content="#121212">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/style.css?v=12">
<script src="js/content.js?v=10" defer></script>
<script src="js/iux-cloud.js?v=9" defer></script>
<script src="js/site-content.js?v=11" defer></script>
<script src="js/board.js?v=9" defer></script>
</head>
<body class="sub">

<header class="header is-solid" id="header">
  <div class="header__in">
    <a href="./" class="logo">IUX<span>.</span>STUDIO</a>
    <nav class="gnb" aria-label="주요 메뉴">
      <a href="./#works">PORTFOLIO</a><a href="./#service">SERVICE</a><a href="./#process">PROCESS</a><a href="./#about">ABOUT</a><a href="notice.html" class="is-on">NOTICE</a><a href="faq.html">FAQ</a><a href="./#contact">CONTACT</a>
    </nav>
    <a href="./#contact" class="btn-line header__cta">문의하기</a>
    <button type="button" class="burger" id="burger" aria-label="메뉴" aria-expanded="false" aria-controls="mmenu"><span></span><span></span><span></span></button>
  </div>
</header>

<div class="mmenu" id="mmenu" aria-hidden="true">
  <nav class="mmenu__nav" aria-label="모바일 메뉴">
    <a href="./#works">PORTFOLIO<svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></a>
    <a href="./#service">SERVICE<svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></a>
    <a href="./#process">PROCESS<svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></a>
    <a href="./#about">ABOUT<svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></a>
    <a href="notice.html">NOTICE<svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></a>
    <a href="faq.html">FAQ<svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></a>
    <a href="./#contact">CONTACT<svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></a>
  </nav>
</div>

<main class="wrap board" data-board="notice">
  <div class="board__head">
    <p class="eyebrow">NOTICE</p>
    <h1 class="h2" id="boardTitle">공지사항</h1>
  </div>

  <!-- 목록 -->
  <div id="listView">
    <div class="board__tools">
    <form class="board__search" id="searchForm" role="search">
      <input type="search" name="q" placeholder="제목 검색" aria-label="제목 검색">
      <button type="submit" aria-label="검색"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
    </form>
    </div>
    <ul class="board__list" id="postList"></ul>
    <nav class="pager" id="pager" aria-label="페이지"></nav>
  </div>

  <!-- 상세 -->
  <article class="post" id="postView" hidden>
    <header class="post__head">
      <p class="post__meta" id="postMeta"></p>
      <h2 class="post__title" id="postTitle"></h2>
    </header>
    <img class="post__cover" id="postCover" alt="" hidden>
    <div class="post__body md" id="postBody"></div>
    <div class="post__foot"><a href="notice.html" class="btn-line btn-line--grey" id="backBtn">목록으로</a></div>
  </article>
</main>

<footer class="footer">
  <div class="wrap footer__in">
    <div>
      <p class="logo logo--sm">IUX<span>.</span>STUDIO</p>
    </div>
    <div class="footer__info">
      <p class="footer__copy">© <span id="year">2026</span> IUX.STUDIO. All rights reserved.</p>
    </div>
  </div>
</footer>
</body>
</html>
